# _config.yml
title: Mustapha El Bouazaoui
email: mustaphaelbouazaoui@gmail.com
description: >-
  Portfolio & Research Blog of Mustapha El Bouazaoui — PhD Researcher in Information Theory & Quantum Information at UM6P, Cybersecurity & Telecom Engineer from IMT Atlantique.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://Ahpatsum15.github.io" # the base hostname & protocol for your site
github_username: Ahpatsum15
linkedin_username: elbouazaouimustapha
twitter_username: AhpaTsum1337
cv_url: "/assets/files/CV_PhD_mustapha_el bouazaoui_updated.pdf"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed

# Exclude vendor and cache from build
exclude:
  - vendor/
  - .bundle/
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock

sass:
  style: compressed # Minify CSS

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
